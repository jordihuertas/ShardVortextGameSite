<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join the Shard Vortex closed beta, download the test version, and share your feedback." />
  <title>Closed Beta Testing &mdash; Shard Vortex</title>
  <link rel="icon" type="image/png" href="public/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sv-bg': '#0a0a0f',
            'sv-card': '#12121c',
            'sv-accent': '#7b2fff',
            'sv-cyan': '#00e5ff',
            'sv-muted': '#9090b0',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-sv-bg text-gray-200 overflow-x-hidden" data-page="closed-beta">

  <div id="site-header"></div>

  <section class="relative flex items-center justify-center text-center overflow-hidden pt-[70px] min-h-[48vh]">
    <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(123,47,255,0.3) 0%, transparent 70%), radial-gradient(ellipse 50% 40% at 85% 85%, rgba(0,229,255,0.12) 0%, transparent 65%);"></div>
    <div class="relative z-10 px-6 py-16 max-w-3xl">
      <span data-i18n="closed_beta_eyebrow" class="inline-block text-[0.75rem] font-bold tracking-[0.15em] uppercase text-sv-accent mb-4 px-3.5 py-1 border border-[rgba(123,47,255,0.25)] rounded-full"></span>
      <h1 data-i18n="closed_beta_title" class="text-4xl md:text-6xl font-black gradient-text mb-5"></h1>
      <p data-i18n="closed_beta_intro" class="text-sv-muted text-base md:text-xl max-w-2xl mx-auto leading-relaxed"></p>
    </div>
  </section>

  <main class="pb-24 px-6 bg-sv-bg">
    <div class="max-w-4xl mx-auto space-y-8">
      <section class="bg-sv-card border border-[rgba(123,47,255,0.25)] rounded-2xl p-7 md:p-10 fade-in">
        <div class="flex flex-col md:flex-row md:items-center gap-6">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-3">
              <span class="flex items-center justify-center w-9 h-9 rounded-full bg-[rgba(123,47,255,0.16)] text-sv-accent font-black" aria-hidden="true">1</span>
              <h2 data-i18n="closed_beta_signup_title" class="text-2xl font-extrabold text-white"></h2>
            </div>
            <p data-i18n="closed_beta_signup_text" class="text-sv-muted leading-relaxed"></p>
          </div>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLScG0RlQICCIiZFMo_2a1SfAYhZHnP3dMJONXocTET_GSR3_YQ/viewform?usp=dialog" target="_blank" rel="noopener noreferrer" data-i18n="closed_beta_signup_button" class="inline-flex items-center justify-center px-6 py-3.5 rounded-full font-semibold text-white text-center no-underline hover:-translate-y-0.5 transition-all duration-300" style="background: linear-gradient(135deg, #7b2fff, #a855f7); box-shadow: 0 4px 24px rgba(123,47,255,0.35);"></a>
        </div>
      </section>

      <section class="bg-sv-card border border-[rgba(123,47,255,0.25)] rounded-2xl p-7 md:p-10 fade-in">
        <div class="flex items-center gap-3 mb-3">
          <span class="flex items-center justify-center w-9 h-9 rounded-full bg-[rgba(0,229,255,0.12)] text-sv-cyan font-black" aria-hidden="true">2</span>
          <h2 data-i18n="closed_beta_download_title" class="text-2xl font-extrabold text-white"></h2>
        </div>
        <p data-i18n="closed_beta_download_text" class="text-sv-muted leading-relaxed mb-6"></p>
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center gap-5 rounded-xl border border-[rgba(0,229,255,0.25)] bg-[rgba(0,229,255,0.04)] p-5">
            <span class="flex items-center justify-center w-10 h-10 rounded-full bg-[rgba(0,229,255,0.12)] text-sv-cyan font-black flex-shrink-0" aria-hidden="true">1</span>
            <div class="flex-1">
              <h3 data-i18n="closed_beta_testing_step_title" class="text-lg font-bold text-white mb-1"></h3>
              <p data-i18n="closed_beta_testing_step_text" class="text-sv-muted leading-relaxed"></p>
            </div>
            <a href="https://play.google.com/apps/testing/com.GrilloStudios.ShardVortex" target="_blank" rel="noopener noreferrer" data-i18n="closed_beta_testing_link" class="inline-flex items-center justify-center px-5 py-3 rounded-xl border border-[rgba(0,229,255,0.4)] text-sv-cyan font-semibold text-center no-underline hover:bg-[rgba(0,229,255,0.08)] hover:-translate-y-0.5 transition-all duration-300"></a>
          </div>
          <div class="flex flex-col sm:flex-row sm:items-center gap-5 rounded-xl border border-[rgba(0,229,255,0.25)] bg-[rgba(0,229,255,0.04)] p-5">
            <span class="flex items-center justify-center w-10 h-10 rounded-full bg-[rgba(0,229,255,0.12)] text-sv-cyan font-black flex-shrink-0" aria-hidden="true">2</span>
            <div class="flex-1">
              <h3 data-i18n="closed_beta_store_step_title" class="text-lg font-bold text-white mb-1"></h3>
              <p data-i18n="closed_beta_store_step_text" class="text-sv-muted leading-relaxed"></p>
            </div>
            <a href="https://play.google.com/store/apps/details?id=com.GrilloStudios.ShardVortex" target="_blank" rel="noopener noreferrer" data-i18n="closed_beta_store_link" class="inline-flex items-center justify-center px-5 py-3 rounded-xl border border-[rgba(0,229,255,0.4)] text-sv-cyan font-semibold text-center no-underline hover:bg-[rgba(0,229,255,0.08)] hover:-translate-y-0.5 transition-all duration-300"></a>
          </div>
        </div>
      </section>

      <aside class="bg-[rgba(123,47,255,0.1)] border border-[rgba(123,47,255,0.45)] rounded-2xl p-7 md:p-8 fade-in" role="note">
        <div class="flex items-start gap-4">
          <span class="text-3xl flex-shrink-0" aria-hidden="true">&#9203;</span>
          <div>
            <h2 data-i18n="closed_beta_important_title" class="text-xl font-extrabold text-white mb-2"></h2>
            <p data-i18n="closed_beta_important_text" class="text-gray-300 leading-relaxed"></p>
          </div>
        </div>
      </aside>

      <section class="bg-sv-card border border-[rgba(123,47,255,0.25)] rounded-2xl p-7 md:p-10 fade-in">
        <div class="flex flex-col md:flex-row md:items-center gap-6">
          <div class="flex-1">
            <h2 data-i18n="closed_beta_feedback_title" class="text-2xl font-extrabold text-white mb-3"></h2>
            <p data-i18n="closed_beta_feedback_text" class="text-sv-muted leading-relaxed"></p>
          </div>
          <a href="https://forms.gle/zhZHfrbc8fpJirYZ6" target="_blank" rel="noopener noreferrer" data-i18n="closed_beta_feedback_button" class="inline-flex items-center justify-center px-6 py-3.5 rounded-full border-2 border-sv-accent text-white font-semibold text-center no-underline hover:bg-sv-accent hover:-translate-y-0.5 transition-all duration-300"></a>
        </div>
      </section>

      <section class="relative overflow-hidden rounded-2xl p-7 md:p-10 fade-in" style="background: linear-gradient(135deg, rgba(123,47,255,0.22), rgba(88,101,242,0.2)); border: 1px solid rgba(123,47,255,0.5);">
        <div class="absolute -right-16 -top-16 w-48 h-48 rounded-full bg-sv-accent/10 pointer-events-none"></div>
        <div class="relative flex flex-col md:flex-row md:items-center gap-6">
          <div class="flex-1">
            <h2 data-i18n="closed_beta_discord_title" class="text-2xl font-extrabold text-white mb-3"></h2>
            <p data-i18n="closed_beta_discord_text" class="text-gray-300 leading-relaxed"></p>
          </div>
          <a href="https://discord.gg/FbqYP968XR" target="_blank" rel="noopener noreferrer" data-i18n="closed_beta_discord_button" class="inline-flex items-center justify-center px-6 py-3.5 rounded-full bg-[#5865F2] text-white font-semibold text-center no-underline hover:bg-[#6d78f5] hover:-translate-y-0.5 transition-all duration-300"></a>
        </div>
      </section>

      <p data-i18n="closed_beta_thanks" class="text-center text-lg md:text-xl font-semibold text-white pt-5 fade-in"></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/partials.js"></script>
</body>
</html>
