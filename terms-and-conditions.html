<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shard Vortex Privacy Policy — We do not collect any user data." />
  <title>Terms & Conditions — Shard Vortex</title>
  <link rel="icon" type="image/png" href="public/images/logo.png" />
  <!-- Tailwind CSS CDN (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sv-bg':     '#0a0a0f',
            'sv-card':   '#12121c',
            'sv-accent': '#7b2fff',
            'sv-cyan':   '#00e5ff',
            'sv-muted':  '#9090b0',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-sv-bg text-gray-200 overflow-x-hidden" data-page="terms">

  <div id="site-header"></div>

  <!-- PAGE HERO -->
  <div class="relative flex items-center justify-center text-center overflow-hidden pt-[70px] min-h-[40vh]">
    <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(123,47,255,0.25) 0%, transparent 70%);"></div>
    <div class="relative z-10 px-6 py-16">
      <h1 data-i18n="terms_title" class="text-4xl md:text-5xl font-black text-white mb-3"></h1>
      <p class="text-sv-muted text-sm">
        <span data-i18n="pp_last_updated"></span>: <span data-i18n="legal_effective_date"></span>
      </p>
    </div>
  </div>

  <!-- POLICY CONTENT -->
  <section class="py-20 px-6 bg-sv-bg">
    <div class="max-w-[760px] mx-auto">
      <div class="bg-sv-card border border-[rgba(123,47,255,0.25)] rounded-xl p-8 md:p-12 fade-in">

        <h2 class="text-xl font-bold text-white mb-3" data-i18n="terms_intro_title"></h2>
        <p data-i18n="terms_intro_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_license_title"></h2>
        <p data-i18n="terms_license_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_ads_title"></h2>
        <p data-i18n="terms_ads_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <p class="mb-3"><a href="privacy-policy.html" data-i18n="nav_privacy" class="text-sv-cyan hover:underline"></a></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_rewards_title"></h2>
        <p data-i18n="terms_rewards_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_ip_title"></h2>
        <p data-i18n="terms_ip_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_service_title"></h2>
        <p data-i18n="terms_service_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_liability_title"></h2>
        <p data-i18n="terms_liability_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_law_title"></h2>
        <p data-i18n="terms_law_text" class="text-sv-muted leading-relaxed mb-3"></p>
        <h2 class="text-xl font-bold text-white mt-9 mb-3" data-i18n="terms_contact_title"></h2>
        <p data-i18n="terms_contact_text" class="text-sv-muted leading-relaxed mb-2"></p>
        <p><a href="mailto:info@shardvortex.com" class="text-sv-cyan hover:underline">info@shardvortex.com</a></p>

      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/partials.js"></script>
</body>
</html>
